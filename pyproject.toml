[project]
name = "djcanteen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordhy-jpg", email = "177513224+Jordhy-jpg@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "markdown>=3.11.3",
    "psycopg>=3.3.8",
    "psycopg-binary>=3.3.8",
]

[project.scripts]
djcanteen = "djcanteen:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
]
